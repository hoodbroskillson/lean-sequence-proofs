name: Check Fibonacci and Beatty proofs
on:
  push:
    paths:
      - 'research/**'
      - '.github/workflows/fibonacci-beatty.yml'
  pull_request:
    paths:
      - 'research/**'
      - '.github/workflows/fibonacci-beatty.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: leanprover-community/mathlib4
          ref: b5eba595428809e96f3ed113bc7ba776c5f801ac
          path: mathlib4-fib-beatty
      - name: Install elan
        run: sudo apt-get update -qq && sudo apt-get install -y elan
      - name: Fetch the pinned mathlib cache
        working-directory: mathlib4-fib-beatty
        run: lake exe cache get
      - name: Check proofs and audit axioms
        run: bash research/verify.sh mathlib4-fib-beatty
